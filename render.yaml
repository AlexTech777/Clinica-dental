services:
  - type: web
    name: sonrisa-clara-panel
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: sonrisa-clara-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/dental.db
      - key: TIMEZONE
        value: America/Santiago
      - key: DRY_RUN
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
